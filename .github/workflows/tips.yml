name: Update betting tips

on:
  schedule:
    # Every hour. GitHub starts scheduled runs late (often hours) or skips them, so the script itself
    # decides what is due: settle every run, publish the 11:00 card once it is past 11 and the 15:00
    # update once it is past 15 (Copenhagen). The league update runs it too.
    - cron: "17 * * * *"
  workflow_dispatch:          # "Run workflow" button

concurrency:
  group: update-data          # shared with the league update, so the two never push at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install --quiet cryptography==48.0.0 numpy==2.3.2
      - name: Build tips
        env:
          ADV_PASSWORD: ${{ secrets.ADV_PASSWORD }}
        run: python scripts/tips.py
      - name: Commit changes
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          [ -f scripts/cache/tips_private.enc.json ] && git add scripts/cache/tips_private.enc.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update betting tips"
            git pull --rebase
            git push
          fi
