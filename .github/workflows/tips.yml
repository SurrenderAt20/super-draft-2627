name: Update betting tips

on:
  schedule:
    # Every hour. GitHub starts scheduled runs late (often hours) or skips them, so the script itself
    # decides what is due: settle every run, publish the 11:00 card once it is past 11 and the 15:00
    # update once it is past 15 (Copenhagen). The league update runs it too.
    - cron: "17 * * * *"
  workflow_dispatch:          # "Run workflow" button, and the ladder buttons on the Betting page
    inputs:
      action: { description: "replace, manual, result, or publish for an extra card (empty: a normal run)", required: false, default: "" }
      step: { description: "ladder step, attempt:day:order", required: false, default: "" }
      match: { description: "own bet: match id", required: false, default: "" }
      mkt: { description: "own bet: market", required: false, default: "" }
      sel: { description: "own bet: selection", required: false, default: "" }
      odds: { description: "own bet: odds", required: false, default: "" }
      text: { description: "own bet: free text when the match is not in the list", required: false, default: "" }
      res: { description: "result of an own free-text bet: won, lost or void", required: false, default: "" }

concurrency:
  group: update-data          # shared with the league update, so the two never push at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install --quiet cryptography==48.0.0 numpy==2.3.2
      - name: Build tips
        # inputs reach the script as environment variables only, never inside the shell command
        env:
          ADV_PASSWORD: ${{ secrets.ADV_PASSWORD }}
          TIPS_ACTION: ${{ inputs.action }}
          TIPS_STEP: ${{ inputs.step }}
          TIPS_MATCH: ${{ inputs.match }}
          TIPS_MKT: ${{ inputs.mkt }}
          TIPS_SEL: ${{ inputs.sel }}
          TIPS_ODDS: ${{ inputs.odds }}
          TIPS_TEXT: ${{ inputs.text }}
          TIPS_RES: ${{ inputs.res }}
        run: python scripts/tips.py
      - name: Commit changes
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          [ -f scripts/cache/tips_private.enc.json ] && git add scripts/cache/tips_private.enc.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update betting tips${{ inputs.action && ' (ladder change)' || '' }}"
            git pull --rebase
            git push
          fi
