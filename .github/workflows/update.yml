name: Update league data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), off the hour to avoid GitHub's busiest minute
  workflow_dispatch:          # "Run workflow" button for a manual update

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install --quiet cryptography==48.0.0 numpy==2.3.2
      - name: Build data
        env:
          ADV_PASSWORD: ${{ secrets.ADV_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # scripts/cache holds last season and the odds (fetched at most once every 20 hours)
          git add docs/data scripts/cache
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update league data"
            git push
          fi
